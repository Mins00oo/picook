<?xml version="1.0" encoding="UTF-8"?>
<!-- 남자 셰프 — 댄디 헤어, 앞머리가 이마 위로 차분하게 내려옴. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <!-- 그림자 -->
  <ellipse cx="50" cy="97" rx="22" ry="2.5" fill="rgba(31,22,18,0.18)"/>

  <!-- 다리 -->
  <rect x="41" y="80" width="7" height="14" rx="3" fill="#FCE4D0" stroke="#3A2418" stroke-width="2"/>
  <rect x="52" y="80" width="7" height="14" rx="3" fill="#FCE4D0" stroke="#3A2418" stroke-width="2"/>

  <!-- 발 -->
  <ellipse cx="44.5" cy="95" rx="7" ry="2.6" fill="#F4C9A7" stroke="#3A2418" stroke-width="1.8"/>
  <ellipse cx="55.5" cy="95" rx="7" ry="2.6" fill="#F4C9A7" stroke="#3A2418" stroke-width="1.8"/>

  <!-- 몸통 (흰 티) -->
  <rect x="36" y="58" width="28" height="26" rx="7" fill="#FFFFFF" stroke="#3A2418" stroke-width="2.2"/>

  <!-- 왼팔 + 손 -->
  <path d="M 36 64 Q 28 70 28 80" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 36 64 Q 28 70 28 80" stroke="#3A2418" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="28" cy="81" r="4.5" fill="#FCE4D0" stroke="#3A2418" stroke-width="2"/>
  <!-- 오른팔 + 손 -->
  <path d="M 64 64 Q 72 70 72 80" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 64 64 Q 72 70 72 80" stroke="#3A2418" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="72" cy="81" r="4.5" fill="#FCE4D0" stroke="#3A2418" stroke-width="2"/>

  <!-- 머리 -->
  <ellipse cx="50" cy="32" rx="22" ry="24" fill="#FCE4D0" stroke="#3A2418" stroke-width="2.4"/>

  <!-- 귀 -->
  <ellipse cx="28.5" cy="34" rx="2.8" ry="4" fill="#FCE4D0" stroke="#3A2418" stroke-width="1.6"/>
  <ellipse cx="71.5" cy="34" rx="2.8" ry="4" fill="#FCE4D0" stroke="#3A2418" stroke-width="1.6"/>

  <!-- 댄디 헤어: 머리 위쪽 + 앞머리가 양 옆에서 가운데로 부드럽게 내려옴 -->
  <path d="M 28 24
           Q 26 6 50 5
           Q 74 6 72 24
           L 70 30
           Q 62 34 56 30
           Q 50 33 44 30
           Q 38 34 30 30
           L 28 24 Z"
        fill="#8B4513" stroke="#3A2418" stroke-width="2" stroke-linejoin="round"/>

  <!-- 큰 눈 -->
  <circle cx="42" cy="36" r="3" fill="#1F1612"/>
  <circle cx="58" cy="36" r="3" fill="#1F1612"/>
  <circle cx="43" cy="35.3" r="0.8" fill="#FFFFFF"/>
  <circle cx="59" cy="35.3" r="0.8" fill="#FFFFFF"/>

  <!-- 입 (작은 미소) -->
  <path d="M 46 43 Q 50 45 54 43" stroke="#3A2418" stroke-width="1.6" stroke-linecap="round" fill="none"/>
</svg>
